<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - TenderGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            /* softer professional background */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 20px;
            padding: 30px;
            width: 400px;
            background: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #4a6cf7;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 20px;
        }

        .btn-custom {
            background: #4a6cf7;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
        }

        .btn-custom:hover {
            background: #3b5bdb;
        }

        input {
            border-radius: 10px !important;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="logo">🛡️ TenderGuard</div>
        <div class="subtitle">AI-Powered Tender Compliance Validator</div>

        <h4 class="text-center mb-4">Login</h4>

        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

            <button class="btn btn-custom w-100 text-white">Login</button>
        </form>

        <p class="text-center mt-3">
            No account? <a href="/register">Register</a>
        </p>
    </div>

</body>

</html>
