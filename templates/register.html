<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TenderGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            gap: 30px;
            /* Space between card and badges */
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.6s ease-out;
            flex-shrink: 0;
            /* Prevent card from shrinking */
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .logo-icon i {
            font-size: 32px;
            color: white;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #6c757d;
            font-weight: 500;
        }

        .form-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .form-control-custom {
            width: 100%;
            padding: 14px 14px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-control-custom:focus+.input-icon,
        .input-group:focus-within .input-icon {
            color: #667eea;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.5);
        }

        .footer-text {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: 20px;
        }

        .footer-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* FIXED: Better positioned badges with more space */
        .features-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            margin-top: 10px;
        }

        .features-list {
            display: flex;
            justify-content: center;
            gap: 30px;
            /* Increased gap */
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.1);
            /* Subtle background */
            padding: 15px 30px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.95);
            /* Brighter text */
            font-size: 14px;
            /* Slightly larger */
            font-weight: 500;
            white-space: nowrap;
        }

        .feature-item i {
            color: #38ef7d;
            font-size: 16px;
            /* Larger icons */
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 15px;
                gap: 20px;
            }

            .auth-card {
                padding: 30px 20px;
            }

            .features-list {
                flex-direction: column;
                align-items: center;
                gap: 15px;
                padding: 20px;
                border-radius: 20px;
            }

            .features-wrapper {
                padding: 10px 0;
            }
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="brand-header">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="brand-title">TenderGuard</div>
            <div class="brand-subtitle">AI-Powered Tender Compliance Validator</div>
        </div>

        <h2 class="form-title">Create Account</h2>

        <form method="POST" id="registerForm">
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" class="form-control-custom" placeholder="Choose a username" required>
            </div>

            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" name="email" class="form-control-custom" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" class="form-control-custom" placeholder="Create a password"
                    required id="password">
                <i class="fas fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
            </div>

            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="confirm_password" class="form-control-custom"
                    placeholder="Confirm your password" required id="confirmPassword">
            </div>

            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>

        <p class="footer-text">
            Already have an account? <a href="/login">Sign in here</a>
        </p>
    </div>

    <!-- FIXED: Wrapped in container with better spacing -->
    <div class="features-wrapper">
        <div class="features-list">
            <div class="feature-item"><i class="fas fa-check-circle"></i><span>AI-Powered Analysis</span></div>
            <div class="feature-item"><i class="fas fa-check-circle"></i><span>100+ Page RFP Support</span></div>
            <div class="feature-item"><i class="fas fa-check-circle"></i><span>Semantic Matching</span></div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function (e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });

        document.querySelectorAll('.form-control-custom').forEach(input => {
            input.addEventListener('focus', function () {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            input.addEventListener('blur', function () {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>

</body>

</html>
